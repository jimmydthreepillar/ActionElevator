<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--line:#F0F0F2;--blue:#0066CC;--green:#1D7A3A;--red:#B3261E;--amber:#8A4B00;--orange:#B25000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;font-size:15px;line-height:1.4}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #66A3E0;outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #E5E5EA}
.bar{max-width:1200px;margin:0 auto;padding:6px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-height:44px;text-decoration:none;color:var(--ink)}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;height:24px;background:#D2D2D7}
.brand span:last-child{font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink)}
nav a.on{background:var(--ink);color:#fff;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:#D2D2D7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:44px 32px 80px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-size:40px;font-weight:700;letter-spacing:-.025em}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.sub{margin:6px 0 0;font-size:17px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pad{padding:26px 28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.flex{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.grow{flex:1 1 300px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 24px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.off{background:#E8E8ED;color:var(--muted);cursor:not-allowed}
.btn.soft{background:#A8C7EA;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid #C7C7CC;color:var(--ink);font-weight:500;min-height:44px}
.textbtn{border:0;background:transparent;color:var(--blue);min-height:44px;padding:0 8px;font-size:15px}
.badge{display:inline-flex;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
dl{margin:0;border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{color:var(--muted)}dd{margin:0;font-weight:500;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{text-align:left;border:2px solid transparent;background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile.on{border-color:var(--ink)}
.tile b{font-size:32px;letter-spacing:-.02em;line-height:1}
.tile .badge{font-size:12px;align-self:flex-start}
.seg{display:inline-flex;background:#E8E8ED;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#3C3C43;font-size:14px;font-weight:500;min-height:38px;padding:0 18px;border-radius:8px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.case{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case:hover{background:#FAFAFC}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.late{color:var(--orange);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{background:var(--bg);border-radius:14px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.zone.on{background:var(--blue);color:#fff}
.zone.on .small{color:#fff}
.tech{text-align:left;color:var(--ink);background:#fff;border:2px solid #E5E5EA;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%}
.tech.on{border-color:var(--blue)}
.ini{width:40px;height:40px;border-radius:50%;background:#F0F0F2;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tech.on .ini{background:#E6F0FC;color:#0B57B0}
.check{width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid #C7C7CC;flex-shrink:0}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:center}
.vs{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:12px}
.neq{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--red);color:var(--red);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:center;justify-self:center}
.def{background:#FDE9E8;border-radius:12px;padding:12px 14px;display:flex;gap:12px}
.timeline{margin:0;padding:0;list-style:none}
.timeline li{display:flex;gap:14px}
.timeline .rail{display:flex;flex-direction:column;align-items:center}
.timeline .pt{width:14px;height:14px;border-radius:50%;margin-top:4px}
.timeline .ln{width:2px;flex:1;background:#E5E5EA;min-height:32px}
.timeline .txt{padding-bottom:18px}
.progress{height:8px;border-radius:999px;background:#E8E8ED;overflow:hidden}
.progress div{height:8px;background:var(--green);border-radius:999px;transition:width .3s}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;margin-bottom:-16px}
.dispatch{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.dispatch{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr}
  main{padding:28px 18px 60px}
  .bar{padding:6px 18px}
  h1{font-size:32px}

function cases() {
  const f = CASES.filter(c => (S.month === 'All' || c.m === S.month) && (!S.status || c.st === S.status) && (!S.stale || c.late));
  const groups = [['Oct', 'October 2026'], ['Nov', 'November 2026'], ['Dec', 'December 2026']].map(([m, label]) => ({
    label, list: f.filter(c => c.m === m).sort((a, b) => (PR[a.pri] - PR[b.pri]) || (a.day - b.day))

  const hasFilter = S.month !== 'All' || S.status || S.stale;

    </div>
    ${groups.map(g => `<section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;gap:10px;padding:0 4px"><h2>${g.label}</h2><span class="muted">${g.list.length} ${g.list.length === 1 ? 'case' : 'cases'}</span></div>
      <div class="list">${g.list.map(c => `
        <a class="case" href="#${ST[c.st].go}">
          <div style="flex:1 1 260px;min-width:0"><div style="font-size:16px;font-weight:600">${c.site}</div><div class="small muted">${c.id}, ${c.addr}</div></div>
          <div style="width:90px"><div class="small muted">Due</div><div style="font-weight:500">${c.m} ${c.day}</div></div>
          <div style="width:90px;display:flex;align-items:center;gap:6px"><span class="dot" style="background:${DOT[c.pri]}"></span><span style="font-size:14px;font-weight:500">${c.pri}</span></div>
          <div style="width:236px">${badge(c.st)}</div>
          <div style="width:170px">${c.late ? `<span class="late">${I.warn()}Report ${c.late} days late</span>` : ''}</div>
          ${I.chev}
        </a>`).join('')}</div></section>`).join('')}
    ${groups.length ? '' : `<div class="card" style="padding:48px;text-align:center"><div class="muted">No cases match these filters.</div><button class="textbtn" data-act="clear">Clear filters</button></div>`}
  </main>`;
}

function coverage() {
  const bill = S.scenario === 'Billable';
  const locked = bill && !S.attached;
  return `<main>
    <a class="back" href="#cases">${I.back} Open Cases</a>
    <div class="flex" style="justify-content:space-between;align-items:flex-end">
      <div><h1>${bill ? 'Riverside Lofts' : 'Parkline Office Plaza'}</h1>
      <p class="sub">${bill ? 'ST-10490, Car 1, due October 10' : 'ST-10493, Cars 1–6, due October 14'}</p></div>
      <div class="seg" role="group" aria-label="Example case">
        <button class="${bill ? 'on' : ''}" data-act="scenario:Billable">Billable example</button>
        <button class="${bill ? '' : 'on'}" data-act="scenario:Covered">Covered example</button>
      </div>
    </div>
    <div class="grid2">
      <section class="card pad" style="display:flex;flex-direction:column;gap:22px" aria-label="Contract coverage">
        <div class="eyebrow">Contract coverage</div>
        <div class="flex" style="gap:14px">
          ${bill ? `<div class="circle" style="background:#FFF1DC;width:52px;height:52px">${I.card}</div><div><div class="big">Billable</div><div class="muted">Safety test isn’t in this agreement</div></div>`
                 : `<div class="circle" style="background:#E3F5E8;width:52px;height:52px">${I.check('#1D7A3A', 26)}</div><div><div class="big">Covered</div><div class="muted">Included in the maintenance agreement</div></div>`}
        </div>
        <dl>
          <div><dt>Agreement</dt><dd>${bill ? 'MA-2291' : 'MA-1874'}</dd></div>
          <div><dt>Plan</dt><dd>${bill ? 'Standard maintenance' : 'Full service'}</dd></div>
          <div><dt>Safety testing</dt><dd>${bill ? 'Not included' : 'Included'}</dd></div>
          <div><dt>Estimate</dt><dd>${bill ? '[QUOTE AMOUNT]' : 'No charge'}</dd></div>
        </dl>
        <div class="small muted">Determined automatically from the customer’s agreement terms.</div>
      </section>
      <section class="card pad" style="display:flex;flex-direction:column;gap:22px" aria-label="Customer approval">
        <div class="eyebrow">Customer approval</div>
        ${!bill ? `<div><div class="big">Not needed</div><div class="muted">Covered work doesn’t require a customer sign-off.</div></div>` : `
        <div><div class="big">${S.attached ? 'Approved' : 'Waiting on customer'}</div><div class="muted">Billable jobs need the customer’s approval email on the case.</div></div>
        <ol class="steps">
          <li><span class="check">${I.check()}</span>Quote sent to j.moreno@riversidelofts.com</li>
          <li>${S.attached ? `<span class="check">${I.check()}</span>` : `<span class="ring"></span>`}Approval email attached</li>
        </ol>
        ${S.attached ? `
          <div style="display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:14px 16px">${I.mail}
            <div style="flex:1;min-width:0"><div style="font-weight:600">RE: Safety test quote, Riverside Lofts</div><div class="small muted">From j.moreno@riversidelofts.com, approved</div></div>
            <button class="textbtn" data-act="attach:0">Remove</button></div>`
        : `<button data-act="attach:1" style="display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed #C7C7CC;background:#FAFAFC;color:var(--blue);font-size:16px;font-weight:600;min-height:72px;border-radius:14px">${I.mail} Attach approval email</button>`}`}
      </section>
    </div>
    <section class="card flex" style="padding:22px 28px" aria-label="Scheduling">
      ${locked ? `<div class="circle" style="background:#EDEDF0;width:44px;height:44px">${I.lock()}</div>
        <div class="grow"><div style="font-size:17px;font-weight:600">Scheduling is locked</div><div class="muted">Attach the customer’s approval email to unlock dispatch.</div></div>
        <button class="btn off" disabled>Schedule</button>`
      : `<div class="circle" style="background:#E3F5E8;width:44px;height:44px">${I.check('#1D7A3A', 20)}</div>
        <div class="grow"><div style="font-size:17px;font-weight:600">Ready to schedule</div><div class="muted">All pre-dispatch checks passed.</div></div>
        <a class="btn primary" href="#dispatch">Schedule</a>`}
    </section>
  </main>`;
}

function dispatch() {
  const t = TECHS.find(x => x.id === S.tech);
  const zones = [['North', '1 case'], ['Central', '2 cases'], ['East', 'No cases'], ['West', 'No cases'], ['Harbor', 'No cases'], ['South', 'No cases']];
  const todo = [['ST-10493', 'Parkline Office Plaza', 'Central', 'Oct 14', 'Weekdays after 6 pm'], ['ST-10518', 'Westbrook Apartments', 'Central', 'Nov 9', 'Mornings only'], ['ST-10531', 'Maple Court Senior Living', 'North', 'Dec 2', 'Tue or Thu']];
  const steps = ['Copy a service activity for each assigned technician', 'Remove safety-test associations where required', 'Update resource assignments', 'Link timecards'];
  return `<main>
    <div><h1>Dispatch</h1><p class="sub">3 cases ready to schedule, matched by area, due month and customer timing</p></div>
    <div class="dispatch">
      <div class="col">
        <section class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px" aria-label="Service areas">
          <div style="display:flex;justify-content:space-between"><div class="eyebrow">Service areas</div><div class="small muted">Highlighted: ${t.area}</div></div>
          <div class="zones">${zones.map(([n, c]) => `<div class="zone ${n === t.area ? 'on' : ''}"><div style="font-weight:600">${n}</div><div class="small ${n === t.area ? '' : 'muted'}">${c}</div></div>`).join('')}</div>
        </section>
        <section class="list" aria-label="Cases to assign">
          <div class="eyebrow" style="padding:20px 24px 8px">Cases to assign</div>
          ${todo.map(([id, s, a, d, w]) => `<div class="case" style="padding:14px 24px;border-top:1px solid var(--line)">
            <div style="flex:1 1 200px"><div style="font-weight:600">${s}</div><div class="small muted">${id}, ${a}</div></div>
            <div style="width:90px;font-size:14px"><div class="small muted">Due</div>${d}</div>
            <div style="width:170px;font-size:14px"><div class="small muted">Customer timing</div>${w}</div></div>`).join('')}
        </section>
      </div>
      <div class="col">
        <section class="card" style="padding:24px;display:flex;flex-direction:column;gap:12px" aria-label="Technicians">
          <div class="eyebrow">Best match</div>
          ${TECHS.map(x => `<button class="tech ${x.id === S.tech ? 'on' : ''}" data-act="tech:${x.id}" aria-pressed="${x.id === S.tech}">
            <span class="ini">${x.ini}</span><span style="flex:1"><span style="display:block;font-weight:600">${x.name}</span><span class="small muted">${x.why}</span></span>
            ${x.id === S.tech ? `<span class="check" style="background:var(--blue)">${I.check()}</span>` : `<span class="ring"></span>`}</button>`).join('')}
        </section>
        <section class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px" aria-label="FIELDBOSS">
          <div><div class="eyebrow">FIELDBOSS</div><div style="font-size:20px;font-weight:700;margin-top:4px">${S.generated ? 'Done. 3 service activities created.' : 'This happens automatically'}</div></div>
          <ul class="steps">${steps.map(s => `<li>${S.generated ? `<span class="check">${I.check()}</span>` : `<span class="ring"></span>`}<span>${s}</span></li>`).join('')}</ul>
          ${S.generated ? `<div style="background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px"><div style="font-weight:600">SA-88213, SA-88214, SA-88215</div><div class="muted">Assigned to ${t.name}, no manual entry</div></div>
            <button class="textbtn" data-act="gen:0">Undo</button>`
          : `<button class="btn primary" data-act="gen:1">Assign and create service activities</button>`}
        </section>
      </div>
    </div>
  </main>`;
}

function reconcile() {
  return `<main>
    <a class="back" href="#cases">${I.back} Open Cases</a>
    <div><h1>Northgate Medical Center</h1><p class="sub">ST-10477, service car B, annual safety test</p></div>
    <section role="alert" class="flex" style="background:var(--red);color:#fff;border-radius:20px;padding:22px 26px">
      <div class="circle" style="background:rgba(255,255,255,.18)">${I.warn('#fff', 24)}</div>
      <div class="grow"><div style="font-size:20px;font-weight:700">The results don’t match</div>
      <div>The mechanic passed this test, but the QEI report lists 2 deficiencies. This case can’t close until you review the report.</div></div>
    </section>
    <div class="vs">
      <section class="card pad" style="display:flex;flex-direction:column;gap:20px" aria-label="Mechanic result">
        <div class="eyebrow">Mechanic’s field result</div>
        <div class="flex" style="gap:12px"><div class="circle" style="background:#E3F5E8;width:52px;height:52px">${I.check('#1D7A3A', 26)}</div><div class="big" style="font-size:32px">Passed</div></div>
        <dl><div><dt>Technician</dt><dd>R. Alvarez</dd></div><div><dt>Tested</dt><dd>Sep 22, 2026</dd></div><div><dt>Source</dt><dd>FIELDBOSS safety test outcome</dd></div></dl>
        <div style="background:var(--bg);border-radius:12px;padding:14px 16px"><div class="small muted">Technician notes</div>All devices operated normally. No issues observed.</div>
      </section>
      <div class="neq" aria-label="Does not match">≠</div>
      <section class="card pad" style="display:flex;flex-direction:column;gap:20px;border:2px solid var(--red)" aria-label="QEI report">
        <div class="eyebrow">QEI inspection report</div>
        <div class="flex" style="gap:12px"><div class="circle" style="background:#FDE9E8;width:52px;height:52px">${I.x}</div><div class="big" style="font-size:32px">2 deficiencies</div></div>
        <dl><div><dt>Inspector</dt><dd>K. Brennan, QEI</dd></div><div><dt>Received</dt><dd>Sep 29, 2026</dd></div><div><dt>Source</dt><dd><a href="#reconcile">QEI-NG-0922.pdf</a></dd></div></dl>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="def"><b style="color:var(--red)">1</b><div><div style="font-weight:600">Pit stop switch inoperative</div><div class="small muted">Code ref [CODE SECTION]</div></div></div>
          <div class="def"><b style="color:var(--red)">2</b><div><div style="font-weight:600">Car door restrictor out of adjustment</div><div class="small muted">Code ref [CODE SECTION]</div></div></div>
        </div>
      </section>
    </div>
    <section class="card" style="padding:24px 28px;display:flex;flex-direction:column;gap:18px" aria-label="Resolve">
      ${S.routed ? `<div class="flex">
          <div class="circle" style="background:#E3F5E8;width:44px;height:44px">${I.check('#1D7A3A', 22)}</div>
          <div class="grow"><div style="font-size:17px;font-weight:600">Moved to Deficiency Review</div><div class="muted">The QEI result governs. A linked reinspection case opens when this case closes.</div></div>
          <a class="btn primary" href="#reinspection">View reinspection</a><button class="textbtn" data-act="route:0">Undo</button></div>`
      : `<label style="display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-size:16px">
          <input type="checkbox" id="reviewed" ${S.reviewed ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--blue);margin:0">
          I’ve reviewed the QEI report and its deficiencies</label>
        <div class="flex" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:18px">
          <div style="display:flex;align-items:center;gap:10px" class="muted">${I.lock('#6E6E73')}Closing as passed is blocked while the results disagree.</div>
          <div class="flex" style="gap:10px"><button class="btn off" disabled>Close as passed</button>
          ${S.reviewed ? `<button class="btn primary" data-act="route:1">Send to Deficiency Review</button>` : `<button class="btn soft" disabled>Send to Deficiency Review</button>`}</div>
        </div>`}
    </section>
  </main>`;
}

function reinspection() {
  const V = [['a', 'Pit stop switch inoperative', 'Assigned to R. Alvarez, part ordered'], ['b', 'Car door restrictor out of adjustment', 'Assigned to R. Alvarez']];
  const n = V.filter(([id]) => S.fixed[id]).length, all = n === V.length, pct = Math.round(n / V.length * 100) + '%';
  const pt = (c, last) => `<div class="rail"><span class="pt" style="background:${c}"></span>${last ? '' : '<span class="ln"></span>'}</div>`;
  return `<main>
    <div><h1>Reinspection</h1><p class="sub">What happens when a QEI report arrives</p></div>
    <div class="grid2">
      <section class="card pad" style="display:flex;flex-direction:column;gap:20px" aria-label="Report passes">
        <span class="badge" style="align-self:flex-start;background:#E3F5E8;color:#1D6B35">Report passes</span>
        <ol class="timeline">
          <li>${pt('#1D7A3A')}<div class="txt"><div style="font-weight:600">QEI report received: pass</div><div class="small muted">Matches the mechanic’s result</div></div></li>
          <li>${pt('#1D7A3A', 1)}<div><div style="font-weight:600">Original case closes automatically</div><div class="small muted">Nothing else to do</div></div></li>
        </ol>
      </section>
      <section class="card pad" style="display:flex;flex-direction:column;gap:20px" aria-label="Report fails">
        <span class="badge" style="align-self:flex-start;background:#FDE9E8;color:#B3261E">Report fails</span>
        <ol class="timeline">
          <li>${pt('#B3261E')}<div class="txt"><div style="font-weight:600">QEI report received: deficiencies</div><div class="small muted">Reviewed by the coordinator</div></div></li>
          <li>${pt('#3C3C43')}<div class="txt"><div style="font-weight:600">Original case closes</div><div class="small muted">ST-10477</div></div></li>
          <li>${pt('#0066CC', 1)}<div><div style="font-weight:600">Linked reinspection case opens</div><div class="small muted">RI-10477, violations tracked until fixed</div></div></li>
        </ol>
      </section>
    </div>
    <section class="list" aria-label="Active reinspection">
      <div class="flex" style="padding:24px 28px;border-bottom:1px solid var(--line);gap:20px">
        <div class="grow"><div class="eyebrow">RI-10477, linked to ST-10477</div><div style="font-size:24px;font-weight:700;margin-top:4px">Northgate Medical Center</div><div class="muted">Reinspection due by [DUE DATE]</div></div>
        <div style="min-width:220px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:14px"><b>${n} of ${V.length} fixed</b><span class="muted">${pct}</span></div>
          <div class="progress"><div style="width:${pct}"></div></div></div>
      </div>
      ${V.map(([id, t, d]) => `<div class="case" style="padding:18px 28px">
        <div style="flex:1 1 280px"><div style="font-size:16px;font-weight:600">${t}</div><div class="small muted">${d}</div></div>
        ${S.fixed[id] ? `<span class="badge" style="background:#E3F5E8;color:#1D6B35">Fixed</span><button class="textbtn" data-act="fix:${id}">Undo</button>`
                      : `<span class="badge" style="background:#FFF1DC;color:#8A4B00">Being fixed</span><button class="btn ghost" data-act="fix:${id}">Mark fixed</button>`}
      </div>`).join('')}
      <div class="flex" style="padding:20px 28px;justify-content:space-between">
        <div class="muted">${all ? 'All violations fixed. Book the QEI to reinspect.' : 'Reinspection unlocks when every violation is fixed.'}</div>
        ${all ? `<a class="btn primary" href="#dispatch">Schedule reinspection</a>` : `<button class="btn off" disabled>Schedule reinspection</button>`}
      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px" aria-label="Other open reinspections">
      <h2 style="padding:0 4px">Other open reinspections</h2>
      <div class="list">
        <div class="case"><div style="flex:1 1 260px"><div style="font-weight:600">Cedar Point Mall</div><div class="small muted">RI-10388, linked to ST-10388</div></div><div style="width:120px;font-size:14px">1 of 3 fixed</div><span class="badge" style="background:#FFF1DC;color:#8A4B00">Being fixed</span></div>
        <div class="case"><div style="flex:1 1 260px"><div style="font-weight:600">Summit Hotel</div><div class="small muted">RI-10402, linked to ST-10402</div></div><div style="width:120px;font-size:14px">2 of 2 fixed</div><span class="badge" style="background:#E6F0FC;color:#0B57B0">Ready to reinspect</span></div>
      </div>
    </section>
  </main>`;
}

const SCREENS = { cases, coverage, dispatch, reconcile, reinspection };
const app = document.getElementById('app');
let lastRoute = '';

function render() {
  const route = SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'cases';
  app.innerHTML = nav(route) + SCREENS[route]();
  if (route !== lastRoute) { window.scrollTo(0, 0); lastRoute = route; }
}

const ACT = {
  stale: () => { S.stale = !S.stale; },
  status: (k) => { S.status = S.status === k ? '' : k; },
  month: (m) => { S.month = m; },
  clear: () => { S.month = 'All'; S.status = ''; S.stale = false; },
  scenario: (v) => { S.scenario = v; },
  attach: (v) => { S.attached = v === '1'; },
  tech: (id) => { S.tech = id; S.generated = false; },
  gen: (v) => { S.generated = v === '1'; },
  route: (v) => { S.routed = v === '1'; if (!S.routed) S.reviewed = false; },
  fix: (id) => { S.fixed = { ...S.fixed, [id]: !S.fixed[id] }; }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const [a, arg] = el.dataset.act.split(':');
  ACT[a](arg);
  const focus = el.dataset.act;
  render();
  const again = app.querySelector(`[data-act="${focus}"]`);
  if (again) again.focus({ preventScroll: true });
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'reviewed') { S.reviewed = e.target.checked; render(); app.querySelector('#reviewed')?.focus(); }
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
